# BedWars1058-WinFix configuration

# Statistic used to rank the "Top" rows. Leave empty to use the same statistic BedWars1058
# uses for its own end-game sidebar (general.game-end.sb-top.order-by, "kills" by default).
order-by: ""

# Hide "Top" rows for players that have 0 of the ranked statistic.
# false = list every player of the match (like BedWars1058 does).
hide-zero-values: false

# When the match had MORE players than the language file has "Top" rows, repeat the last row
# so everybody can be listed, as long as the sidebar has room (a sidebar holds at most 15 lines).
expand-rows: true
max-sidebar-lines: 15

# How many ticks after the game ends the sidebar is rebuilt. BedWars1058 builds its own
# sidebar first, this addon then replaces it. Raise it if you still see raw placeholders.
refresh-delay-ticks: 10

debug: false
